<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
  <meta charset="UTF-8">
  <title>주문목록</title>
</head>
<body>
<th:block layout:fragment="content" >

  <h2 class="mt-5">구매이력</h2>

  <th:block th:each="dto : ${responesPageDTO.dtoList}">

    <div class="row  mt-2 mb-2">

      <div class="col">

        <h4 >[[${dto.orderDate + ' 주문'}]]

          <th:block th:if="${dto.orderStatus.name() == 'ORDER'}">

            <button type="submit" th:value="${dto.orderId}" class="btn btn-warning orderCancel">주문취소</button>
          </th:block>
          <th:block th:if="${dto.orderStatus.name() == 'CANCEL'}">

            <span>(취소완료)</span>
          </th:block>

        </h4>
      </div>

    </div>


    <div class="row">
      <div class="col">
        <div class="card">

          <div class="row align-items-center">
            <th:block th:each="orderItemDTO :  ${dto.orderItemDTOList}">

              <div class="col">
                <img th:src="${'/images/' + orderItemDTO.imgUrl}">
              </div>
              <div class="col ">
                <div class="card-body ">

                  <h4 class="card-title " th:text="${orderItemDTO.itemNm}"></h4>

                  <span class="card-text" th:text="${orderItemDTO.orderPrice + '원'}"> sdfasf</span>

                  <span class="card-text" th:text="${orderItemDTO.count + '개'}"> sdfasf</span>


                </div>
              </div>
            </th:block>
          </div>



  </div>

  </div>

  </div>

  </div>

</th:block>

  <script>

   let orderCancel = $('.orderCancel')
    //let orderCancel = document.querySelector('.orderCancel');

  orderCancel.on("click",function () {

    alert("자장가")
    alert( $(this).val() )
    //보낼주소 /order/pk번호/cancel
    //method post
    //보낼값 orderId $(this).val()

    $.ajax({
      url : `/order/${$(this).val()}/cancel`,
      type : "post" ,
      success : function (data) {
        console.log(data)
        alert("주문이 취소되었습니다. ")
        location.href = "/orders"

      },
      error : function (jqXHR,status,error) {
        if (jqXHR.status == '401'){
          alert("로그인후 이용하세요")
          location.href="/user/login" //401 로그인 안되었었을때 로그인 페이지

        }else if (jqXHR.status == '403'){
          alert(jqXHR.responseText) //에러에 대한 내용출력
          location.href="/user/login";

        }

      }

    })

  })


  </script>




</th:block>




</body>
</html>
